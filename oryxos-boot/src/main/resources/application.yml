spring:
  application:
    name: oryxos
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.cache.use_second_level_cache: false
  threads:
    virtual:
      enabled: true

server:
  address: 127.0.0.1
  port: 8080
  tomcat:
    accept-count: 256
    max-connections: 1024
    max-keep-alive-requests: -1
    keep-alive-timeout: 120s

# Public contract uses OpenAPI 3.0 nullable semantics.
springdoc:
  api-docs:
    version: OPENAPI_3_0
