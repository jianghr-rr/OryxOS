name: Deploy OryxOS to Tencent Cloud

on:
  push:
    branches:
      - main
    paths:
      - 'oryxos-*/**'
      - 'pom.xml'
      - 'deploy/tencent-cloud/**'
      - '.github/workflows/deploy-tencent-cloud.yml'
  workflow_dispatch:
    inputs:
      sync_secrets:
        description: 'Render secrets.local.yaml from GitHub Secrets (0600) on server'
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-tencent-cloud-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build, Verify & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Configure Maven mirror and HTTP retries
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <profiles>
              <profile>
                <id>ci-maven-mirror</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
                <repositories>
                  <repository>
                    <id>gcs-maven-central</id>
                    <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>gcs-maven-central</id>
                    <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
                <properties>
                  <aether.transport.http.retryHandler.count>5</aether.transport.http.retryHandler.count>
                  <aether.transport.http.retryHandler.interval>5000</aether.transport.http.retryHandler.interval>
                  <aether.transport.http.retryHandler.intervalMax>30000</aether.transport.http.retryHandler.intervalMax>
                </properties>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: Build and run regression suite
        run: |
          mkdir -p "${{ github.workspace }}/.oryxos-dev/evidence"
          RUN_ID="$(cat /proc/sys/kernel/random/uuid)"
          EXCLUDED_GROUPS="real-integration,kernel-soak,kernel-short-gate,kernel-writer-probe,kernel-redactor-probe,kernel-reader-probe,kernel-provider-probe,kernel-soak-harness"
          if command -v mvn >/dev/null 2>&1; then
            mvn -B -ntp verify \
              -Doryxos.test.runId="${RUN_ID}" \
              -Doryxos.test.evidenceDir="${{ github.workspace }}/.oryxos-dev/evidence" \
              -DexcludedGroups="${EXCLUDED_GROUPS}"
          else
            ./mvnw -B -ntp verify \
              -Doryxos.test.runId="${RUN_ID}" \
              -Doryxos.test.evidenceDir="${{ github.workspace }}/.oryxos-dev/evidence" \
              -DexcludedGroups="${EXCLUDED_GROUPS}"
          fi

      - name: Prepare release artifact & checksum
        id: artifact
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="$(date -u +%Y%m%d%H%M%S)-${SHORT_SHA}"
          rm -rf /tmp/oryxos-release
          java -Djarmode=tools \
            -jar oryxos-boot/target/oryxos-boot-1.0.0-SNAPSHOT.jar \
            extract --destination /tmp/oryxos-release
          mv /tmp/oryxos-release/oryxos-boot-*.jar /tmp/oryxos-release/oryxos-boot.jar
          (cd /tmp/oryxos-release && sha256sum oryxos-boot.jar > oryxos-boot.jar.sha256)
          mkdir -p /tmp/oryxos-release/config
          rsync -a --exclude='secrets.local.yaml*' deploy/tencent-cloud/config/ /tmp/oryxos-release/config/
          ls -lh /tmp/oryxos-release/oryxos-boot.jar
          du -sh /tmp/oryxos-release/lib
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload shared-lib artifact (for optional manual seed)
        uses: actions/upload-artifact@v4
        with:
          name: oryxos-shared-lib
          path: /tmp/oryxos-release/lib
          retention-days: 1

      - name: Configure SSH client
        env:
          SSH_HOST: ${{ secrets.TENCENT_SSH_HOST }}
          SSH_PORT: ${{ secrets.TENCENT_SSH_PORT }}
          SSH_USER: ${{ secrets.TENCENT_SSH_USER }}
          SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${SSH_HOST:?TENCENT_SSH_HOST secret is required}"
          : "${SSH_USER:?TENCENT_SSH_USER secret is required}"
          : "${SSH_KEY:?TENCENT_SSH_KEY secret is required}"
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/tencent_key
          chmod 600 ~/.ssh/tencent_key
          printf 'Host tencent\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/tencent_key\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n  LogLevel ERROR\n' \
            "${SSH_HOST}" "${PORT}" "${SSH_USER}" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Render secrets.local.yaml (if configured)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_secrets }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${DEEPSEEK_API_KEY:-}" ] || [ -n "${FEISHU_WEBHOOK_URL:-}" ]; then
            {
              [ -n "${DEEPSEEK_API_KEY:-}" ] && printf 'DEEPSEEK_API_KEY: %s\n' "${DEEPSEEK_API_KEY}"
              [ -n "${FEISHU_WEBHOOK_URL:-}" ] && printf 'FEISHU_WEBHOOK_URL: %s\n' "${FEISHU_WEBHOOK_URL}"
            } > /tmp/oryxos-release/secrets.local.yaml
            chmod 600 /tmp/oryxos-release/secrets.local.yaml
          else
            echo "No DEEPSEEK_API_KEY / FEISHU_WEBHOOK_URL secrets set; skipping secrets.local.yaml upload."
          fi

      - name: Upload artifact and switch release on server
        run: |
          set -euo pipefail
          VERSION="${{ steps.artifact.outputs.version }}"
          REMOTE_RELEASE_DIR="/opt/oryxos/releases/${VERSION}"

          ls -lh /tmp/oryxos-release/oryxos-boot.jar
          echo "[deploy] Creating remote release dir ${REMOTE_RELEASE_DIR}..."
          ssh tencent "sudo mkdir -p '${REMOTE_RELEASE_DIR}' && sudo chown -R \$(whoami) '${REMOTE_RELEASE_DIR}' && mkdir -p '${REMOTE_RELEASE_DIR}/config'"

          echo "[deploy] Syncing shared-lib via rsync..."
          rsync -rlz --checksum --no-owner --no-group --no-perms --no-times --delete --partial --timeout=120 /tmp/oryxos-release/lib/ "tencent:/opt/oryxos/shared-lib/"

          echo "[deploy] Uploading thin oryxos-boot.jar, config, and deploy scripts..."
          rsync -rlz --no-owner --no-group --no-perms --no-times --delete --exclude='secrets.local.yaml*' --timeout=120 /tmp/oryxos-release/config/ "tencent:${REMOTE_RELEASE_DIR}/config/"
          scp -O -C /tmp/oryxos-release/oryxos-boot.jar /tmp/oryxos-release/oryxos-boot.jar.sha256 deploy/tencent-cloud/scripts/sync-workspace-config.sh "tencent:${REMOTE_RELEASE_DIR}/"
          scp -O -C deploy/tencent-cloud/scripts/deploy-release.sh deploy/tencent-cloud/scripts/rollback.sh "tencent:/tmp/"

          if [ -f /tmp/oryxos-release/secrets.local.yaml ]; then
            echo "[deploy] Uploading secrets.local.yaml..."
            scp -O -C /tmp/oryxos-release/secrets.local.yaml "tencent:/tmp/secrets.local.yaml.incoming"
            ssh tencent "sudo mv /tmp/secrets.local.yaml.incoming /var/lib/oryxos/workspace/secrets.local.yaml && sudo chown oryxos:oryxos /var/lib/oryxos/workspace/secrets.local.yaml && sudo chmod 0600 /var/lib/oryxos/workspace/secrets.local.yaml"
          fi

          echo "[deploy] Switching release and running health check..."
          ssh tencent "sudo chown -R oryxos:oryxos '${REMOTE_RELEASE_DIR}' && sudo install -m 0750 -o root -g oryxos /tmp/deploy-release.sh /opt/oryxos/bin/deploy-release.sh && sudo install -m 0750 -o root -g oryxos /tmp/rollback.sh /opt/oryxos/bin/rollback.sh && rm -f /tmp/deploy-release.sh /tmp/rollback.sh && sudo /opt/oryxos/bin/deploy-release.sh '${REMOTE_RELEASE_DIR}'"

      - name: Cleanup runner secrets and staging files
        if: always()
        run: |
          rm -rf /tmp/oryxos-release ~/.ssh/tencent_key ~/.ssh/config
