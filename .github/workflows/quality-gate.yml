name: Quality Gate

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:
    outputs:
      boot-jar-artifact:
        description: 'Name of the uploaded boot JAR artifact'
        value: ${{ jobs.verify.outputs.boot-jar-artifact }}

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  verify:
    name: Full Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      boot-jar-artifact: oryxos-boot-jar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache project Maven repository
        uses: actions/cache@v4
        with:
          path: |
            .oryxos-dev/repository
            .oryxos-dev/maven
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Format check
        env:
          ORYXOS_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: ./tools/dev/mvnw -B -ntp spotless:check

      # Checkstyle/PMD/SpotBugs and tests share this step; the failing gate is named on the
      # first "Quality gate FAIL: G<n>(<tool>)" log line (plan deviation D-6).
      - name: Full verify (tools/dev/mvnw clean verify)
        env:
          ORYXOS_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: ./tools/dev/mvnw -B -ntp clean verify

      - name: Baseline must not grow
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ref="origin/${{ github.base_ref }}"
          else
            ref="origin/main"
          fi
          ./tools/dev/quality-baseline --check-shrink "$ref"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            oryxos-*/target/pmd.xml
            oryxos-*/target/checkstyle-result.xml
            oryxos-*/target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: oryxos-boot-jar
          path: oryxos-boot/target/oryxos-boot-*.jar
          if-no-files-found: error
          retention-days: 1
