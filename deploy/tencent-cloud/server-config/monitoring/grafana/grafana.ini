; Managed by sync-server-config.sh (monitoring). Host-specific values come from
; /etc/oryxos-monitoring/monitoring.env (GF_SERVER_ROOT_URL); the admin password from a 0600 file.

[paths]
data = /var/lib/grafana
logs = /var/lib/grafana/log
plugins = /var/lib/grafana/plugins
provisioning = /opt/oryxos/monitoring-config/current/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3300
serve_from_sub_path = true
root_url = ${GF_SERVER_ROOT_URL}

[security]
admin_user = admin
admin_password = $__file{/etc/oryxos-monitoring/secrets/grafana-admin-password}
disable_gravatar = true
cookie_secure = true

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[auth.basic]
enabled = false

[unified_alerting]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true

[news]
news_feed_enabled = false

[log]
mode = console
level = info
