# Managed by sync-server-config.sh (monitoring); validated with promtool before activation.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: oryxos
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:8080']

  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ['127.0.0.1:9090']
