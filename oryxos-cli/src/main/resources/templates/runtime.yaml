schema_version: 1
timezone: Asia/Shanghai
# Configure a provider and credential reference before chat. Light commands do not probe accounts.
providers: {}
memory:
  backend: md
  archival_context_characters: 4000
tools:
  file:
    allowed_read_paths: []
    allowed_write_paths: []
  shell:
    allowed_commands: []
    allowed_script_paths: []
    timeout_seconds: 20
  http:
    allowed_targets: []
    connect_timeout_seconds: 5
    read_timeout_seconds: 20
    max_response_bytes: 65536
